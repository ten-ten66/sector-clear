name: Deploy demo to GitHub Pages

# ひとりプレイ（AI 対戦）はブラウザだけで完結するため、クライアントを静的デモとして公開する。
# マルチプレイにはゲームサーバーが必要なので、デモ版では案内メッセージを表示する。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - name: Build static demo
        run: npx vite build --base=/sector-clear/
        env:
          VITE_STATIC_DEMO: "1"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
